# ---------------------------------------------------------------
#  Auto video editor settings.  Lines starting with # are notes.
#  Command-line flags (like --style 4) override these values.
# ---------------------------------------------------------------

# Caption style: number (1-13) or name. See them all: python editor.py styles
style: yellow_pop

# Colour grade: natural_clean, none, warm, black_and_white, orange_teal, high_contrast
grade: natural_clean

# Pacing preset (defined further down under "presets")
preset: fast

# Speech language for transcription ("tl" = Tagalog/Filipino, works for Taglish)
language: tl

transcription:
  provider: groq              # "groq" (online, needs GROQ_API_KEY in .env) or "local" (on your PC)
  groq_model: whisper-large-v3 # the most accurate Groq Whisper (turbo is faster but misses more Taglish)
  taglish_hint: true          # send a short Taglish line + words from your instruction and file names
  local_model: medium         # local model size: small, medium, large-v3 (bigger = slower, better)
  local_device: auto          # auto, cpu or cuda (NVIDIA graphics card)
  vocabulary_file: vocabulary.json   # your words + corrections (the app edits it)

presets:
  fast:
    silence_threshold: 0.25   # cut pauses longer than this many seconds
    remove_fillers: true      # cut "ah", "uh", "um"... (list below)
    zoom: true                # jump-cut punch-in zoom
    zoom_amount: 1.15         # 1.15 = 115% zoom on zoomed parts
    zoom_min_interval: 1.5    # never change zoom more often than this (seconds)
    zoom_max_interval: 4.0    # change zoom at least this often, even without a cut
  relaxed:
    silence_threshold: 0.6
    remove_fillers: true
    zoom: true
    zoom_amount: 1.10
    zoom_min_interval: 3.0
    zoom_max_interval: 7.0

silence:
  padding: 0.08               # seconds of air kept around every cut so words are not clipped
  use_audio_detection: true   # also listen for quiet parts (helps when word timings are loose)
  noise_db: -35               # what counts as "quiet". Noisy room? try -30

fillers: [ah, uh, um, uhm, eh]

zoom:
  anchor_y: 0.4               # where to zoom: 0 = top of frame, 0.5 = middle (0.4 suits faces)

audio:
  loudness: -14               # target loudness in LUFS (TikTok/Reels like about -14)
  true_peak: -1.5

captions:
  enabled: true
  fonts_folder: assets/fonts  # fonts in this folder are always available to the captions
  font_regular: Inter         # on Windows you can use e.g. Arial
  font_bold: Inter            # e.g. Arial
  font_heavy: Inter Black     # e.g. Arial Black
  punctuation: remove         # remove = no , . ! ? ; : or quotes on screen (i-check, 3,600 stay); keep

highlight:                    # KEY WORDS in colour (only styles that support it)
  enabled: true
  color:                      # leave empty to use each style's colour (yellow), or e.g. "#00E5FF"
  manual_markers: true        # words written as *word* in the transcript JSON
  numbers: true
  prices: true                # 500 pesos, P1,299, $5
  english_terms: true         # app, online, GitHub, AI, loan words...
  long_words: true            # words longer than long_word_min_letters
  long_word_min_letters: 7
  max_per_4_words: 1          # at most this many keywords in every 4 words (manual ones always kept)
  extra_keywords: []          # always highlight these, e.g. [gcash, promo]
  ignore_words: []            # never highlight these

overlays:                     # pop-in images/clips when a keyword is spoken (see triggers.yaml)
  enabled: true
  triggers_file: triggers.yaml
  folder: assets/overlays

tracking:                     # effects that follow your hands / face (docs/tracking.md)
  hand_model: ""              # hand_landmarker.task; empty = models/tracking/hand_landmarker.task
  face_model: ""              # blaze_face_short_range.tflite (also gives the body, roughly)
  pose_model: ""              # optional pose_landmarker_*.task for a better body
  fps: 30                     # points per second (your video's rate is a good choice)
  min_confidence: 0.5
  swap_hands: false           # true if "left" and "right" come out the wrong way round

graphics:                     # motion graphics the AI edit adds (docs/graphics.md)
  style: auto                 # auto = only when you ask ("like a professional promoter"), or
                              # promoter | calm_documentary | meme | news | luxury | minimal |
                              # premium_editorial | off
  max_per_10s:                # empty = the style's own limit (promoter 4, documentary 1...)
  track_face: true            # find the face (if tracking is set up) so graphics keep off it
  min_font: 30                # smallest text size (px on the 1080x1920 frame) before a warning

music:                        # background music a preset may add (docs/presets.md)
  folder: assets/music        # your own music files (that you may use); names say the mood,
                              # e.g. upbeat_summer.mp3, calm_piano.mp3. None are bundled.

presets_folder: presets       # your own presets (plain JSON); same id = replaces a built-in one

polish:                       # `polish` and `polish-watch` (docs/polish.md): for the posting workers
  inbox: robot/inbox          # drop videos here (and optionally <name>.job.json)
  outbox: robot/outbox        # <name>.mp4 + <name>.project.json + <name>.json (written last)
  failed: robot/failed        # the original + <name>.json (why) + <name>.log
  done: robot/done            # originals of polished videos
  settle_seconds: 10          # a file must stop changing this long before it is taken
  interval_seconds: 5         # how often the inbox is checked
  max_minutes: 30             # no automatic retry after this many minutes on one video

broll:                        # B-roll the AI edit adds: your library, then free stock, then AI
  library_folder: ""          # a folder with your own clips/pictures; names = what they show
  use_stock: true             # Pexels/Pixabay, only if PEXELS_API_KEY / PIXABAY_API_KEY is set

editorial:                    # PREMIUM EDITORIAL VIRAL: YOUR name / handle / brand for the profile
  name: ""                    # and logo cards (empty = those cards are left out; nothing is made up).
  handle: ""                  # Your photo: a picture named avatar/profile; your logo: one named logo.
  brand: ""

sfx:                          # your own sound effects (none are included)
  enabled: false
  volume: 0.4
  pop: assets/sfx/pop.wav     # plays when an overlay pops in
  whoosh: assets/sfx/whoosh.wav   # plays on zoom cuts

branding:                     # leave empty to skip
  intro: ""                   # image (.png/.jpg) or short clip (.mp4) shown first
  intro_duration: 2.0         # seconds (for images)
  outro: ""
  outro_duration: 2.0
  watermark: ""               # logo .png (transparent background works best)
  watermark_position: top_left   # top_left, top_right, bottom_left, bottom_right
  watermark_width: 180
  watermark_opacity: 0.85

output:
  folder: output
  fps: 30
  crf: 20                     # video quality: lower = better quality, bigger file (18-23 is good)
  encoder_speed: medium       # faster = quicker export, slightly bigger file: veryfast, fast, medium
  audio_bitrate: 192k
  save_transcript: true       # save <name>.transcript.json next to the video (edit it and re-run with --transcript)
  save_project: true          # save <name>_edited.project.json (the timeline; open it in the app or re-render it)

ai:                           # the AI edit (desktop app, or: python editor.py ai-edit)
  provider: groq              # "groq" (default) or "anthropic" (your own key, paid)
  groq_model: openai/gpt-oss-120b
  anthropic_model: claude-opus-5-5
  anthropic_effort: medium    # low, medium, high: more effort = better plans, more cost
  max_tokens: 8000
  cache_folder: work/cache    # saved transcripts and plans (re-runs cost nothing)
  # Prices in US$ for the cost estimate only. Check them on the provider's pricing page:
  # the Groq prices were NOT checked against groq.com when this file was written.
  prices:
    whisper-large-v3: {per_audio_hour: 0.111, min_seconds: 10}
    whisper-large-v3-turbo: {per_audio_hour: 0.04, min_seconds: 10}
    openai/gpt-oss-120b: {input_per_million: 0.15, output_per_million: 0.75}
    claude-opus-5-5: {input_per_million: 4.00, output_per_million: 20.00}
    claude-sonnet-5-5: {input_per_million: 2.00, output_per_million: 10.00}
    claude-haiku-5-5: {input_per_million: 0.10, output_per_million: 0.50}

work_folder: work
keep_work_files: false        # true = keep temporary files in work/ for troubleshooting

watch:
  interval_seconds: 5         # how often "watch" checks the inbox folder
