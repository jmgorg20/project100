# The service on one machine (a VPS): HTTPS proxy + API + Postgres + one CPU worker.
#   cp deploy/.env.example deploy/.env    (fill in every CHANGE_ME)
#   python editor.py service-admin signing-key deploy/secrets/signing-key.pem
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
# With Supabase as the database, remove the "db" service and set SERVICE_DATABASE_URL to Supabase's.
# GPU workers (your PC) are not here: they connect to https://API_DOMAIN from outside (docs/service.md).

x-hardening: &hardening
  read_only: true
  security_opt: ["no-new-privileges:true"]
  cap_drop: ["ALL"]
  restart: unless-stopped
  logging:
    driver: json-file
    options: {max-size: "20m", max-file: "5"}

services:
  proxy:
    image: ${CADDY_IMAGE:-caddy:2.10}
    ports: ["80:80", "443:443"]
    environment:
      API_DOMAIN: ${API_DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    cap_drop: ["ALL"]
    cap_add: ["NET_BIND_SERVICE"]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    depends_on: [api]
    networks: [edge]

  db:
    image: ${POSTGRES_IMAGE:-postgres:16}
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres-init.sh:/docker-entrypoint-initdb.d/10-app-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      retries: 10
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    networks: [data]

  api:
    <<: *hardening
    build: {context: .., dockerfile: deploy/Dockerfile.api, args: {BASE: "${PYTHON_IMAGE:-python:3.12-slim}"}}
    env_file: .env
    environment:
      SERVICE_DATA_DIR: /data
    volumes:
      - apidata:/data
      - ./secrets/signing-key.pem:/run/secrets/signing-key.pem:ro
    tmpfs: ["/tmp"]
    depends_on:
      db: {condition: service_healthy}
    expose: ["8787"]
    networks: [edge, data]

  worker-cpu:
    <<: *hardening
    build: {context: .., dockerfile: deploy/Dockerfile.worker, args: {BASE: "${PYTHON_IMAGE:-python:3.12-slim}"}}
    env_file: .env
    environment:
      AUTOEDIT_SERVER: ${SERVICE_PUBLIC_URL}
      AUTOEDIT_SERVICE_PUBLIC_KEY: /run/secrets/signing-key.pem.pub
    volumes:
      - ./secrets/signing-key.pem.pub:/run/secrets/signing-key.pem.pub:ro
      - workerdata:/work
    tmpfs: ["/tmp", "/app/.cache"]
    # the worker needs only outbound HTTPS (the API at its public address, Groq/Anthropic, stock
    # sites): no ports, and its own network, so it cannot reach the database or the API's insides
    depends_on: [proxy]
    networks: [worker]

networks:
  edge: {}                # proxy <-> api
  data: {internal: true}  # api <-> database only; no internet
  worker: {}              # the worker: outbound only

volumes:
  pgdata: {}
  apidata: {}
  workerdata: {}
  caddy-data: {}
  caddy-config: {}
